<!DOCTYPE html>
<!-- 错题集 v1.0 · 2026-11-18 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>错题集</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --line:#e5e7eb; --text:#1f2937; --muted:#6b7280;
  --primary:#2563eb; --danger:#dc2626; --warn:#d97706; --ok:#15803d;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:16px; line-height:1.55; -webkit-text-size-adjust:100%;
}
button{font-family:inherit}
.muted{color:var(--muted)}
.small{font-size:13px}
.wrap{padding:16px 16px 96px;max-width:760px;margin:0 auto}

/* 顶栏 */
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  gap:8px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);
  padding-top:calc(12px + env(safe-area-inset-top));
}
.topbar .right{display:flex;gap:8px;align-items:center}

/* 按钮 */
.btn{
  border:1px solid var(--line);background:#fff;color:var(--text);
  padding:9px 14px;border-radius:10px;font-size:15px;cursor:pointer;line-height:1.2;
}
.btn:active{transform:translateY(1px)}
.btn.tiny{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.block{width:100%;padding:13px;font-size:16px;margin-top:18px}
.btn:disabled{opacity:.6;cursor:default}

/* 登录 */
.login-wrap{max-width:420px;margin:0 auto;padding:56px 20px 40px}
.brand{font-size:30px;margin:0 0 4px;letter-spacing:2px}
.sub{color:var(--muted);margin:0 0 26px;font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:15px;cursor:pointer;color:var(--muted)}
.tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
.hint{color:var(--danger);font-size:14px;min-height:20px;margin:10px 0 0}

/* 表单 */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 5px}
input,select,textarea{
  width:100%;padding:11px 12px;border:1px solid #d1d5db;border-radius:10px;
  font-size:16px;background:#fff;color:var(--text);font-family:inherit;
}
textarea{resize:vertical;line-height:1.5}
input[type=file]{padding:8px;background:#fafafa}
.row2{display:flex;gap:10px}
.row2>div{flex:1;min-width:0}

/* 统计 */
.stats{display:flex;gap:10px;margin-bottom:6px}
.stat{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.stat b.warn{color:var(--warn)}
.stat b.ok{color:var(--ok)}

.sec{font-size:15px;margin:22px 0 10px;color:var(--muted);font-weight:600}
.empty{color:var(--muted);font-size:14px;padding:22px 12px;text-align:center;background:#fff;border:1px dashed var(--line);border-radius:12px}

/* 错题卡片 */
.qcard{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer}
.qcard.due{border-color:#f59e0b;box-shadow:0 0 0 1px #f59e0b inset}
.thumb{width:62px;height:62px;flex:none;border-radius:9px;background:#f0f0f0 center/cover no-repeat;object-fit:cover;display:block}
.qbody{min-width:0;flex:1}
.qtext{font-size:15px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.chip{font-size:12px;padding:2px 9px;border-radius:999px;background:#f3f4f6;color:#4b5563;border:1px solid transparent}
.chip.warn{background:#fef3c7;color:#92400e}
.chip.ok{background:#dcfce7;color:#166534}
.chip.bad{background:#fee2e2;color:#991b1b}
.chip.active{background:var(--primary);color:#fff}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filters .chip{cursor:pointer;padding:5px 12px}

/* 学生卡片（教师端） */
.scard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.scard.inactive{opacity:.55;background:#fafafa}
.scard-main{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.scard-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* 悬浮按钮 */
.fab{
  position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));
  background:var(--primary);color:#fff;border:none;border-radius:999px;
  padding:14px 20px;font-size:16px;box-shadow:0 6px 20px rgba(37,99,235,.35);cursor:pointer;z-index:30;
}

/* 弹窗 */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center;overflow:auto}
.modal{background:#fff;width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
@media(min-width:700px){
  .modal-backdrop{align-items:center}
  .modal{border-radius:18px;max-height:86vh}
}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;position:sticky;top:-16px;background:#fff;padding:6px 0}
.modal-head h3{margin:0;font-size:17px}
.dl{margin:12px 0}
.dl .k{font-size:12px;color:var(--muted);margin-bottom:2px}
.dl .v{font-size:15px;white-space:pre-wrap;word-break:break-word}
.detail-img{width:100%;border-radius:12px;border:1px solid var(--line);margin:10px 0;display:block;cursor:zoom-in}
.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.actions .btn{flex:1;min-width:96px;text-align:center}
.checks{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:240px;overflow:auto;background:#fafafa}
.check{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--text);margin:0;cursor:pointer}
.check input{width:auto;margin:0;flex:none}
#cropStage{position:relative;display:inline-block;max-width:100%;border-radius:10px;overflow:hidden;margin-top:10px;touch-action:none;user-select:none;-webkit-user-select:none}
#cropImg{max-width:100%;max-height:52vh;display:block}
#cropRect{position:absolute;border:2px solid #2563eb;box-sizing:border-box;touch-action:none;cursor:move}
.ch{position:absolute;width:24px;height:24px;background:#2563eb;border:2px solid #fff;border-radius:6px;box-sizing:border-box;touch-action:none}
.ch[data-h=nw]{left:-12px;top:-12px;cursor:nwse-resize}
.ch[data-h=ne]{right:-12px;top:-12px;cursor:nesw-resize}
.ch[data-h=sw]{left:-12px;bottom:-12px;cursor:nesw-resize}
.ch[data-h=se]{right:-12px;bottom:-12px;cursor:nwse-resize}
.ch[data-h=n]{left:50%;margin-left:-12px;top:-12px;cursor:ns-resize}
.ch[data-h=s]{left:50%;margin-left:-12px;bottom:-12px;cursor:ns-resize}
.ch[data-h=w]{top:50%;margin-top:-12px;left:-12px;cursor:ew-resize}
.ch[data-h=e]{top:50%;margin-top:-12px;right:-12px;cursor:ew-resize}
.paper{background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px 28px;margin-top:14px}
.paper h1{font-size:22px;text-align:center;margin:0 0 6px}
.paper .paper-sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:14px}
.paper-meta{display:flex;gap:18px;font-size:14px;color:#374151;border-bottom:1px dashed #d1d5db;padding-bottom:10px;margin-bottom:18px;flex-wrap:wrap}
.q-item{margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid #f0f0f0}
.q-item:last-child{border-bottom:none}
.q-head{display:flex;gap:8px;align-items:flex-start}
.q-no{font-weight:600;flex:none;min-width:26px}
.q-stem{flex:1;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.q-photo{max-width:100%;max-height:70mm;border-radius:8px;margin:8px 0 0 34px;border:1px solid #eee;display:block}
.q-blank{margin-left:34px;border:none}
.q-ans{margin:10px 0 0 34px;background:#f8fafc;border-left:3px solid #93c5fd;padding:8px 12px;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.q-ans b{color:#1d4ed8}
@media print{
  .topbar,.fab,.no-print,.modal-backdrop{display:none!important}
  body{background:#fff}
  .paper{border:none;border-radius:0;padding:0;margin:0}
  .wrap{padding:0!important;max-width:none}
  .q-item{page-break-inside:avoid}
}
/* 标准错题集版式 */
.paper-std{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px 26px;margin-top:14px;color:#111827}
.paper-std .ph{display:flex;justify-content:space-between;font-size:12px;color:#6b7280;border-bottom:1px solid #e5e7eb;padding-bottom:6px;margin-bottom:16px}
.paper-std .ptitle{text-align:center;font-size:19px;font-weight:700;letter-spacing:1px;margin:4px 0 20px}
.paper-std .ptitle em{font-style:normal;color:#b45309}
.paper-std .pmeta{display:flex;gap:20px;font-size:13px;color:#374151;border-bottom:1px dashed #d1d5db;padding-bottom:8px;margin-bottom:16px;flex-wrap:wrap}
.paper-std .qitem{margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid #f3f4f6;page-break-inside:avoid}
.paper-std .qline{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.paper-std .qtag{background:#374151;color:#fff;font-size:12px;padding:2px 9px;border-radius:4px;flex:none;line-height:1.6}
.paper-std .qsrc{color:#6b7280;font-size:12px;padding-top:3px}
.paper-std .qstem{margin-top:6px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.paper-std .qphoto{max-width:100%;max-height:80mm;margin:8px 0;border:1px solid #eee;border-radius:6px;display:block}
.paper-std .qblank{border-bottom:0}
.paper-std .ans-title{text-align:center;font-size:18px;font-weight:700;margin:0 0 16px;color:#b45309}
.paper-std .ans-wrap{column-count:2;column-gap:26px}
.paper-std .ans-item{break-inside:avoid;margin-bottom:14px;font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.paper-std .ans-item b{color:#1d4ed8}
.paper-std .pagefoot{text-align:center;color:#9ca3af;font-size:12px;margin-top:22px}
@media print{
  .paper-std{border:none;border-radius:0;padding:0;margin:0}
  .paper-std .ans-break{page-break-before:always}
}
@page{size:A4;margin:16mm}

/* 提示条 */
.toast{
  position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);
  background:#111827;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;
  opacity:0;pointer-events:none;transition:.22s;z-index:90;max-width:86vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:#991b1b}
.loading{text-align:center;color:var(--muted);padding:80px 0}
.busy{opacity:.55;pointer-events:none}
</style>
</head>

    }).then(function (res) {
      return res.text().then(function (text) {
        var data = null;
        try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
        if (!res.ok) {
          var msg = (data && (data.message || data.hint || data.error_description || data.error)) || ('HTTP ' + res.status);
          throw new Error(msg);
        }
        if (data && data.ok === false) {
          throw new Error(data.error || 'FAILED');
        }
        return data;
      });
    });
  }

  function loadImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = function (e) { URL.revokeObjectURL(url); reject(new Error('图片读不出来')); };
      img.src = url;
    });
  }

  function compressImage(file, maxSide, quality) {
    maxSide = maxSide || 1600;
    quality = quality || 0.75;
    return loadImage(file).then(function (img) {
      var w = img.naturalWidth, h = img.naturalHeight;
      var scale = Math.min(1, maxSide / Math.max(w, h));
      w = Math.round(w * scale); h = Math.round(h * scale);
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      return new Promise(function (resolve, reject) {
        canvas.toBlob(function (blob) {
          if (blob) resolve(blob); else reject(new Error('图片压缩失败'));
        }, 'image/jpeg', quality);
      });
    });
  }

  function newImageBase(ownerId) {
    return ownerId + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
  }

  function cropToCanvas(img, crop, maxSide) {
    var w = img.naturalWidth || img.width;
    var h = img.naturalHeight || img.height;
    var c = crop || { x0: 0, y0: 0, x1: 1, y1: 1 };
    var nx0 = (c.x0 === undefined) ? 0 : c.x0;
    var ny0 = (c.y0 === undefined) ? 0 : c.y0;
    var nx1 = (c.x1 === undefined) ? 1 : c.x1;
    var ny1 = (c.y1 === undefined) ? 1 : c.y1;
    var x0 = Math.round(w * nx0);
    var y0 = Math.round(h * ny0);
    var x1 = Math.round(w * nx1);
    var y1 = Math.round(h * ny1);
    var cw = Math.max(16, x1 - x0);
    var ch = Math.max(16, y1 - y0);
    var scale = Math.min(1, (maxSide || 1600) / Math.max(cw, ch));
    var outW = Math.max(1, Math.round(cw * scale));
    var outH = Math.max(1, Math.round(ch * scale));
    var canvas = document.createElement('canvas');
    canvas.width = outW;
    canvas.height = outH;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, outW, outH);
    ctx.drawImage(img, x0, y0, cw, ch, 0, 0, outW, outH);
    return canvas;
  }

  function canvasToBlob(canvas, quality) {
    return new Promise(function (resolve, reject) {
      canvas.toBlob(function (blob) {
        if (blob) resolve(blob); else reject(new Error('图片压缩失败'));
      }, 'image/jpeg', quality || 0.75);
    });
  }

    function curSubject() {

    }

    function fillSections() {
      var list = sectionsOf(curSubject(), chapterSel.value);

    chapterSel.addEventListener('change', fillSections);
    if (form.subject) form.subject.addEventListener('change', rebuildChapters);
    fillSections();
    refreshLabels();

    var cropState = { x0: 0, y0: 0, x1: 1, y1: 1 };
    var imgEl = null;
    var stage = document.getElementById('cropStage');
    var cropImg = document.getElementById('cropImg');
    var cropRect = document.getElementById('cropRect');

    function layoutRect() {
      if (!stage || !cropRect) return;
      var W = stage.clientWidth, H = stage.clientHeight;
      cropRect.style.left = (cropState.x0 * W) + 'px';
      cropRect.style.top = (cropState.y0 * H) + 'px';
      cropRect.style.width = Math.max(12, (cropState.x1 - cropState.x0) * W) + 'px';
      cropRect.style.height = Math.max(12, (cropState.y1 - cropState.y0) * H) + 'px';
    }

    var drag = null;
    var MIN = 0.06;

    if (stage) {
      stage.addEventListener('pointerdown', function (e) {
        if (!imgEl) return;
        var h = e.target && e.target.getAttribute ? e.target.getAttribute('data-h') : null;
        var isBody = (e.target === cropRect);
        if (!h && !isBody) return;
        drag = {
          h: h || 'move',
          sx: e.clientX, sy: e.clientY,
          c: { x0: cropState.x0, y0: cropState.y0, x1: cropState.x1, y1: cropState.y1 }
        };
        try { stage.setPointerCapture(e.pointerId); } catch (err) {}
        e.preventDefault();
      });

      stage.addEventListener('pointermove', function (e) {
        if (!drag) return;
        var W = stage.clientWidth || 1, H = stage.clientHeight || 1;
        var dx = (e.clientX - drag.sx) / W;
        var dy = (e.clientY - drag.sy) / H;
        var c = { x0: drag.c.x0, y0: drag.c.y0, x1: drag.c.x1, y1: drag.c.y1 };
        if (drag.h === 'move') {
          var w = c.x1 - c.x0, hh = c.y1 - c.y0;
          var nx = Math.min(Math.max(0, c.x0 + dx), 1 - w);
          var ny = Math.min(Math.max(0, c.y0 + dy), 1 - hh);
          c.x0 = nx; c.x1 = nx + w;
          c.y0 = ny; c.y1 = ny + hh;
        } else {
          var hcode = drag.h;
          if (hcode.indexOf('w') >= 0) c.x0 = Math.min(Math.max(0, c.x0 + dx), c.x1 - MIN);
          if (hcode.indexOf('e') >= 0) c.x1 = Math.max(Math.min(1, c.x1 + dx), c.x0 + MIN);
          if (hcode.indexOf('n') >= 0) c.y0 = Math.min(Math.max(0, c.y0 + dy), c.y1 - MIN);
          if (hcode.indexOf('s') >= 0) c.y1 = Math.max(Math.min(1, c.y1 + dy), c.y0 + MIN);
        }
        cropState = c;
        layoutRect();
        e.preventDefault();
      });

      var endDrag = function () { drag = null; };
      stage.addEventListener('pointerup', endDrag);
      stage.addEventListener('pointercancel', endDrag);
      window.addEventListener('resize', layoutRect);
    }

    var resetBtn = document.getElementById('cropReset');
    if (resetBtn) {
      resetBtn.addEventListener('click', function () {
        cropState = { x0: 0, y0: 0, x1: 1, y1: 1 };
        layoutRect();
      });
    }

    form.photo.addEventListener('change', function (e) {
      var file = e.target.files && e.target.files[0];
      var box = document.getElementById('cropBox');
      if (!file) {
        if (box) box.style.display = 'none';

      loadImage(file).then(function (img) {

        }
        if (box) box.style.display = '';
        setTimeout(layoutRect, 80);
      }).catch(function (err) { toast(friendly(err), 'err'); });
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = document.getElementById('addSubmit');
      var data = {
        subject: (form.subject && form.subject.value) || '物理',
        stem: form.stem.value.trim(),
        my_answer: form.my_answer.value.trim(),
        correct_answer: form.correct_answer.value.trim(),
        analysis: form.analysis.value.trim(),
        error_type: form.error_type.value,
        level: form.level.value,
        chapter: form.chapter.value.trim(),
        section: form.section.value.trim(),
        source: form.source.value.trim()
      };
      var file = form.photo.files && form.photo.files[0];

      if (!data.stem && !file) { toast('至少要有题干或一张照片', 'err'); return; }

      var ids = [];
      if (!isStudent) {
        var picked = form.querySelectorAll('input[name=sid]:checked');
        for (var i = 0; i < picked.length; i++) ids.push(Number(picked[i].value));
        if (!ids.length) { toast('至少选一个学生', 'err'); return; }
      }

      btn.disabled = true;
      btn.textContent = file ? '正在压缩图片…' : '保存中…';

      var chain = Promise.resolve();
      if (file) {
        var base = newImageBase(ownerId);
        var fullName = base + '.jpg';
        var thumbName = base + '-thumb.jpg';
        chain = loadImage(file).then(function (img) {
          btn.textContent = '正在上传图片…';
          var fullCanvas = cropToCanvas(img, cropState, 1600);
          var thumbCanvas = cropToCanvas(img, cropState, 400);
          return canvasToBlob(fullCanvas, 0.75).then(function (blob) {
            return uploadFile(blob, fullName);
          }).then(function () {
            btn.textContent = '正在生成缩略图…';
            return canvasToBlob(thumbCanvas, 0.65);
          }).then(function (tb) {
            return uploadFile(tb, thumbName).catch(function () { return thumbName; });
          });
        }).then(function () {
          data.image_path = fullName;
        });
      }

      chain.then(function () {
        btn.textContent = '保存中…';
        if (isStudent) {
          return rpc('add_my_question', { p_token: S.token, p_data: data });
        }
        return rpc('teacher_add_question_many', { p_token: S.token, p_student_ids: ids, p_data: data });
      }).then(function () {
        closeModal();
        return refreshCurrent();
      }).then(function () {
        toast(isStudent ? '已保存' : ('已加到 ' + ids.length + ' 个学生'));
      }).catch(function (err) {
        toast(friendly(err), 'err');
        var b = document.getElementById('addSubmit');
        if (b) { b.disabled = false; b.textContent = '保存'; }
      });
    });
  }

    var secSel = document.getElementById('esecSel');
    var chLabel = document.getElementById('echLabel');
    var secLabel = document.getElementById('esecLabel');

    function curSubj() {
      return (form.subject && form.subject.value) || subj;
    }

    function fillSec() {
      var list = sectionsOf(curSubj(), chSel.value);
      var h = '<option value="">（不指定）</option>';
      for (var i = 0; i < list.length; i++) {
        h += '<option value="' + list[i] + '"' + (q.section === list[i] ? ' selected' : '') + '>' + list[i] + '</option>';
      }
      secSel.innerHTML = h;
    }

    function rebuild() {
      var s = curSubj();
      chSel.innerHTML = chapterOptionsHtml(s);
      if (q.chapter) chSel.value = q.chapter;
      fillSec();
      var isMath = s === '数学';
      if (chLabel) chLabel.textContent = isMath ? '板块' : '章节';
      if (secLabel) secLabel.textContent = isMath ? '知识点' : '小节';
    }

    chSel.addEventListener('change', fillSec);
    if (form.subject) form.subject.addEventListener('change', rebuild);
    rebuild();

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = document.getElementById('editSubmit');
      btn.disabled = true;
      var data = {
        stem: form.stem.value.trim(),
        my_answer: form.my_answer.value.trim(),
        correct_answer: form.correct_answer.value.trim(),
        analysis: form.analysis.value.trim(),
        error_type: form.error_type.value,
        level: form.level.value,
        chapter: chSel.value,
        section: secSel.value,
        source: form.source.value.trim(),
        subject: curSubj()
      };
      rpc('teacher_update_question', { p_token: S.token, p_id: q.id, p_data: data })
        .then(function () {
          closeModal();
          return refreshCurrent();
        })
        .then(function () { toast('已保存'); })
        .catch(function (err) {
          toast(friendly(err), 'err');
          btn.disabled = false;
        });
    });
  }

  // ====== 组卷 ======
  function openPaper() {
    S.sel = {};
    S.pf = { student: '', level: '', status: '', chapter: '', onlyAnswered: false };
    S.view = 'paper';
    render();
  }

  function paperPool() {
    var qs = (S.questions || []).slice();
    var f = S.pf;
    return qs.filter(function (q) {
      if (f.level && q.level !== f.level) return false;
      if (f.status && q.status !== f.status) return false;
      if (f.chapter && q.chapter !== f.chapter) return false;
      if (f.onlyAnswered && !(q.correct_answer || q.analysis)) return false;
      if (f.student && String(q.student_id) !== String(f.student)) return false;
      return true;
    });
  }

  function renderPaper() {
    var pool = paperPool();
    var chapters = {};
    (S.questions || []).forEach(function (q) { if (q.chapter) chapters[q.chapter] = 1; });
    var chNames = Object.keys(chapters).sort();

    var picked = 0;
    for (var k in S.sel) { if (S.sel[k]) picked++; }

    var html = '';
    html += '<div class="topbar">';
    html += '<button class="btn tiny" data-action="back-teacher">← 返回</button>';
    html += '<strong>组卷</strong>';
    html += '<div class="right"><button class="btn tiny primary" data-action="make-paper">生成试卷</button></div>';
    html += '</div>';

    html += '<div class="wrap">';
    html += '<div class="card" style="margin-bottom:14px">';
    html += '<label>学生</label><select data-filter="student"><option value="">全部学生</option>' +
      (S.students || []).map(function (st) {
        return '<option value="' + st.id + '"' + (String(S.pf.student) === String(st.id) ? ' selected' : '') + '>' +
          esc(st.code) + (st.name ? ' ' + esc(st.name) : '') + '</option>';
      }).join('') + '</select>';
    html += '<label>章节 / 板块</label><select data-filter="chapter"><option value="">全部</option>' +
      chNames.map(function (c) {
        return '<option value="' + esc(c) + '"' + (S.pf.chapter === c ? ' selected' : '') + '>' + esc(c) + '</option>';
      }).join('') + '</select>';
    html += '<div class="row2"><div><label>难度</label><select data-filter="level"><option value="">全部</option>' +
      ['基础', '提升', '拔尖'].map(function (v) { return '<option value="' + v + '"' + (S.pf.level === v ? ' selected' : '') + '>' + v + '</option>'; }).join('') +
      '</select></div><div><label>状态</label><select data-filter="status"><option value="">全部</option>' +
      ['未掌握', '复习中', '已掌握'].map(function (v) { return '<option value="' + v + '"' + (S.pf.status === v ? ' selected' : '') + '>' + v + '</option>'; }).join('') +
      '</select></div></div>';
    html += '<label class="check" style="margin-top:12px"><input type="checkbox" data-filter="onlyAnswered"' + (S.pf.onlyAnswered ? ' checked' : '') + '>只显示有答案或解析的题</label>';
    html += '</div>';

    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0 10px">';
    html += '<span class="muted small">候选 ' + pool.length + ' 道，已选 <b id="selCount">' + picked + '</b> 道</span>';
    html += '<span><button class="btn tiny" data-action="sel-all">全选建议</button> <button class="btn tiny" data-action="sel-none">清空</button></span>';
    html += '</div>';

    html += pool.length ? pool.map(function (q) {
      var on = !!S.sel[q.id];
      return '<label class="qcard" style="cursor:pointer' + (on ? ';border-color:#2563eb' : '') + '">' +
        '<input type="checkbox" data-action="sel" data-id="' + q.id + '"' + (on ? ' checked' : '') + ' style="width:auto;margin-top:4px">' +
        (q.image_path ? '<img class="thumb" loading="lazy" src="' + esc(imgUrl(thumbPathOf(q.image_path))) + '" onerror="this.onerror=null;this.src=\'' + esc(imgUrl(q.image_path)) + '\'" alt="">' : '') +
        '<div class="qbody"><div class="qtext">' + esc(q.stem || '（图片题）') + '</div>' +
        '<div class="chips">' +
          (q.chapter ? '<span class="chip">' + esc(q.chapter) + '</span>' : '') +
          (q.level ? '<span class="chip">' + esc(q.level) + '</span>' : '') +
          (q.status ? '<span class="chip ' + statusClass(q.status) + '">' + esc(q.status) + '</span>' : '') +
          ((q.correct_answer || q.analysis) ? '<span class="chip ok">有解析</span>' : '<span class="chip bad">无解析</span>') +
        '</div></div></label>';
    }).join('') : '<div class="empty">没有符合条件的题。</div>';

    html += '</div>';
    app.innerHTML = html;
  }

  function doBuildPaper() {
    var t = document.getElementById('paperTitle');
    var v = document.getElementById('paperVer');
    var b = document.getElementById('paperBlank');
    var lay = document.getElementById('paperLayout');
    S.paperTitle = (t && t.value.trim()) || '错题重练';
    S.paperWithAnswer = !!(v && v.value === 'teacher');
    S.paperBlank = (b && b.value) || '中';
    S.paperTemplate = (lay && lay.value) || 'std';
    closeModal();
    S.view = 'paperDoc';
    renderPaperDoc();
  }

  function doSelAll() {
    paperPool().forEach(function (q) { S.sel[q.id] = true; });
    renderPaper();
  }

  function openMakePaper() {
    var ids = [];
    for (var k in S.sel) { if (S.sel[k]) ids.push(k); }
    if (!ids.length) { toast('先勾选题目', 'err'); return; }

    var html = '';
    html += '<div class="modal-head"><h3>生成试卷</h3><button class="btn tiny" data-action="close-modal">关闭</button></div>';
    html += '<label>试卷标题</label><input id="paperTitle" value="' + esc(S.paperTitle || '错题重练') + '">';
    html += '<label>版式</label><select id="paperLayout"><option value="std"' + (S.paperTemplate === 'std' ? ' selected' : '') + '>标准错题集（带页眉、原错题N、参考答案页）</option><option value="simple"' + (S.paperTemplate === 'simple' ? ' selected' : '') + '>简约（只有题目和留白）</option></select>';
    html += '<label>版本</label><select id="paperVer"><option value="student">学生版（无答案）</option><option value="teacher">教师版（含答案解析）</option></select>';
    html += '<label>每题留白</label><select id="paperBlank"><option value="无">不留白</option><option value="小">小</option><option value="中" selected>中</option><option value="大">大</option></select>';
    html += '<button class="btn primary block" data-action="paper-build">生成</button>';
    showModal(html);
  }

  function renderPaperStd(qs) {
    var blankH = { '无': 0, '小': 90, '中': 150, '大': 230 }[S.paperBlank] || 0;
    var who = (S.profile && (S.profile.name || S.profile.code)) || '';
    var d = new Date();
    var pad = function (n) { return String(n).padStart(2, '0'); };
    var dateStr = d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());

    var html = '';
    html += '<div class="topbar no-print">';
    html += '<button class="btn tiny" data-action="back-paper">← 返回调整</button>';
    html += '<strong>试卷预览</strong>';
    html += '<div class="right"><button class="btn tiny primary" data-action="do-print">打印 / 存 PDF</button></div>';
    html += '</div>';
    html += '<div class="wrap"><div class="paper-std">';
    html += '<div class="ph"><span>' + esc(who) + ' · 错题集</span><span>共 ' + qs.length + ' 题</span></div>';
    html += '<div class="ptitle"><em>◆</em> ' + esc(S.paperTitle || '错题集') + ' <em>◆</em></div>';
    if (!S.paperWithAnswer) {
      html += '<div class="pmeta"><span>姓名：____________</span><span>日期：____________</span><span>得分：__________</span></div>';
    }

    qs.forEach(function (q, i) {
      html += '<div class="qitem">';
      html += '<div class="qline"><span class="qtag">原错题' + (i + 1) + '</span>' +
        (q.source ? '<span class="qsrc">（题目来源：' + esc(q.source) + '）</span>' : '') + '</div>';
      if (q.stem) html += '<div class="qstem">' + esc(q.stem) + '</div>';
      if (q.image_path) html += '<img class="qphoto" src="' + esc(imgUrl(q.image_path)) + '" alt="">';
      if (blankH) html += '<div class="qblank" style="height:' + blankH + 'px"></div>';
      html += '</div>';
    });

    if (S.paperWithAnswer) {
      html += '<div class="ans-break"></div>';
      html += '<div class="ans-title">◆ 参考答案 ◆</div>';
      html += '<div class="ans-wrap">';
      qs.forEach(function (q, i) {
        html += '<div class="ans-item"><b>原错题' + (i + 1) + '</b><br>';
        if (q.correct_answer) html += '<b>【答案】</b>' + esc(q.correct_answer) + '<br>';
        if (q.analysis) html += '<b>【解析】</b>' + esc(q.analysis);
        if (!q.correct_answer && !q.analysis) html += '<span class="muted">（这道题还没有答案和解析）</span>';
        html += '</div>';
      });
      html += '</div>';
    }

    html += '<div class="pagefoot">' + esc(who) + ' · ' + dateStr + '</div>';
    html += '</div></div>';
    app.innerHTML = html;
  }

  function renderPaperDoc() {
    var ids = [];
    for (var k in S.sel) { if (S.sel[k]) ids.push(k); }
    var qs = (S.questions || []).filter(function (q) { return ids.indexOf(q.id) >= 0; });
    if (!qs.length) { S.view = 'paper'; render(); return; }
    if (S.paperTemplate === 'std') return renderPaperStd(qs);

    var blankH = { '无': 0, '小': 90, '中': 150, '大': 230 }[S.paperBlank] || 0;

    var html = '';
    html += '<div class="topbar no-print">';
    html += '<button class="btn tiny" data-action="back-paper">← 返回调整</button>';
    html += '<strong>试卷预览</strong>';
    html += '<div class="right"><button class="btn tiny primary" data-action="do-print">打印 / 存 PDF</button></div>';
    html += '</div>';
    html += '<div class="wrap"><div class="paper">';
    html += '<h1>' + esc(S.paperTitle || '错题重练') + '</h1>';
    html += '<div class="paper-sub">共 ' + qs.length + ' 题' + (S.paperWithAnswer ? '（教师版）' : '') + '</div>';
    html += '<div class="paper-meta"><span>姓名：____________</span><span>日期：____________</span><span>得分：__________</span></div>';

    qs.forEach(function (q, i) {
      html += '<div class="q-item">';
      html += '<div class="q-head"><div class="q-no">' + (i + 1) + '.</div><div class="q-stem">' + esc(q.stem || '') + '</div></div>';
      if (q.image_path) {
        html += '<img class="q-photo" src="' + esc(imgUrl(q.image_path)) + '" alt="">';
      }
      if (blankH) html += '<div class="q-blank" style="height:' + blankH + 'px"></div>';
      if (S.paperWithAnswer) {
        html += '<div class="q-ans">';
        if (q.correct_answer) html += '<b>答案：</b>' + esc(q.correct_answer) + '\n';
        if (q.analysis) html += '<b>解析：</b>' + esc(q.analysis);
        if (!q.correct_answer && !q.analysis) html += '<span class="muted">（这道题还没有答案和解析）</span>';
        html += '</div>';
      }
      html += '</div>';
    });

    html += '</div></div>';
    app.innerHTML = html;
  }

  // ====== 事件委托 ======
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-action]') : null;
    if (!el) return;
    var a = el.getAttribute('data-action');
    try {
      if (a === 'logout') { doLogout(); return; }
      if (a === 'login-tab') { switchLoginRole(el.getAttribute('data-role')); return; }
      if (a === 'open-q') { openDetail(el.getAttribute('data-id')); return; }
      if (a === 'close-modal') { closeModal(); return; }
      if (a === 'zoom-image') { openImage(el.getAttribute('data-src')); return; }
      if (a === 'add-q') {
        var sid = el.getAttribute('data-student-id');
        openAddForm(sid ? Number(sid) : null);
        return;
      }
      if (a === 'bulk-add') { openAddForm([]); return; }
      if (a === 'review') { doReview(el.getAttribute('data-id'), el.getAttribute('data-result')); return; }
      if (a === 'set-status') { doSetStatus(el.getAttribute('data-id'), el.getAttribute('data-status')); return; }
      if (a === 'del-q') { var dq = qById(el.getAttribute('data-id')); if (dq) openDeleteConfirm(dq); return; }
      if (a === 'edit-q') { openEditQuestion(qById(el.getAttribute('data-id'))); return; }
      if (a === 'del-q-confirm') { doDeleteQuestion(el.getAttribute('data-id')); return; }
      if (a === 'change-pin') { openChangePin(); return; }
      if (a === 'toggle-active') { doToggleActive(el.getAttribute('data-id'), el.getAttribute('data-active') === '1'); return; }
      if (a === 'del-student') { openDeleteStudent(el.getAttribute('data-id'), el.getAttribute('data-code'), el.getAttribute('data-name')); return; }
      if (a === 'del-student-confirm') { doDeleteStudent(el.getAttribute('data-id')); return; }
      if (a === 'rename-student') { openRenameStudent(el.getAttribute('data-id'), el.getAttribute('data-code'), el.getAttribute('data-name')); return; }
      if (a === 'new-student') { openNewStudent(); return; }
      if (a === 'reset-pin') { openResetPin(el.getAttribute('data-id'), el.getAttribute('data-code')); return; }
      if (a === 'open-student') { openStudentView(Number(el.getAttribute('data-id'))); return; }
      if (a === 'back-teacher') { backToTeacher(); return; }
      if (a === 'filter') { setFilter(el.getAttribute('data-status')); return; }
      if (a === 'switch-subject') { switchSubject(el.getAttribute('data-subject')); return; }
      if (a === 'manage-student') { openManageStudent(el.getAttribute('data-id')); return; }
      if (a === 'teacher-admin') { openTeacherAdmin(); return; }
      if (a === 'new-teacher') { openNewTeacher(); return; }
      if (a === 'change-tpin') { openChangeTeacherPin(); return; }
      if (a === 'reset-tpin') { openResetTeacherPin(el.getAttribute('data-id'), el.getAttribute('data-code')); return; }
      if (a === 'toggle-teacher') { doToggleTeacher(el.getAttribute('data-id'), el.getAttribute('data-active') === '1'); return; }
      if (a === 'save-name') { doSaveStudentName(el.getAttribute('data-id')); return; }
      if (a === 'open-paper') { openPaper(); return; }
      if (a === 'back-paper') { S.view = 'paper'; render(); return; }
      if (a === 'make-paper') { openMakePaper(); return; }
      if (a === 'paper-build') { doBuildPaper(); return; }
      if (a === 'sel-all') { doSelAll(); return; }
      if (a === 'sel-none') { S.sel = {}; renderPaper(); return; }
      if (a === 'do-print') { window.print(); return; }
    } catch (err) {
      toast(friendly(err), 'err');
    }
  });

  document.addEventListener('change', function (e) {
    var el = e.target;
    if (!el || !el.getAttribute) return;
    var act = el.getAttribute('data-action');
    if (act === 'sel') {
      var qid = el.getAttribute('data-id');
      S.sel[qid] = el.checked;
      var c = document.getElementById('selCount');
      if (c) {
        var n = 0;
        for (var kk in S.sel) { if (S.sel[kk]) n++; }
        c.textContent = n;
      }
      var card = el.closest ? el.closest('.qcard') : null;
      if (card) card.style.borderColor = el.checked ? '#2563eb' : '';
      return;
    }
    var fk = el.getAttribute('data-filter');
    if (fk) {
      if (fk === 'onlyAnswered') S.pf[fk] = el.checked;
      else S.pf[fk] = el.value;
      if (S.view === 'paper') renderPaper();
      return;
    }
    if (act !== 'assign') return;
    rpc('assign_student', {
      p_token: S.token,
      p_student_id: Number(el.getAttribute('data-sid')),
      p_teacher_id: Number(el.getAttribute('data-tid')),
      p_on: el.checked
    }).then(function () {
      return loadTeacherData();
    }).then(function () {
      toast(el.checked ? '已分配' : '已取消分配');
    }).catch(function (err) {
      toast(friendly(err), 'err');
      el.checked = !el.checked;
    });
  });

  // ====== 启动 ======
  function render() {
    if (S.view === 'student') return renderStudent();
    if (S.view === 'teacher') return renderTeacher();
    if (S.view === 'teacherStudent') return renderTeacherStudent();
    if (S.view === 'paper') return renderPaper();
    if (S.view === 'paperDoc') return renderPaperDoc();
    return renderLogin();
  }

  function boot() {
    loadAuth();
    if (S.token && S.role) {
      S.view = (S.role === 'teacher') ? 'teacher' : 'student';
      app.innerHTML = '<div class="loading">加载中…</div>';
      refreshCurrent().then(function () {
        if (S.role === 'student' && S.profile && S.profile.must_change_pin) openChangePin(true);
        if (S.role === 'teacher' && S.profile && S.profile.must_change_pin) openChangeTeacherPin(true);
      }).catch(function (err) {
        if (String(err.message || err).indexOf('SESSION_INVALID') >= 0) {
          clearAuth();
          S.view = 'login';
          render();
          toast('登录已过期，请重新登录', 'err');
        } else {
          S.view = 'login';
          render();
          toast(friendly(err), 'err');
        }
      });
    } else {
      S.view = 'login';
      render();
    }
  }

  boot();
})();
</script>
</body>
</html>
